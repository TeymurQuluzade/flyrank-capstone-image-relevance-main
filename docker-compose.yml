version: '3.8'
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: image_relevance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: image_relevance
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SIMILARITY_THRESHOLD: 0.75
      CONFIDENCE_THRESHOLD: 0.7
      MAX_AI_COST: 10.00
    depends_on:
      - db

volumes:
  pgdata:
